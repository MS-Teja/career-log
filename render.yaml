# Render Blueprint: one web service that runs the API and serves the built React app.
# Render dashboard → New → Blueprint → pick this repo. Fill in the `sync: false` values when prompted.
services:
  - type: web
    name: career-log
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
      - key: CLIENT_URL
        sync: false # your Render URL, e.g. https://career-log.onrender.com (used in email links)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
